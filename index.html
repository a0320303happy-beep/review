<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計提案評分｜A案．B案．C案</title>
<meta name="description" content="為封面 A案．B案．C案 與內頁版式A．版式B 評分，免登入，每項 1–3 分。">
<meta property="og:type" content="website">
<meta property="og:title" content="設計提案評分｜A案．B案．C案">
<meta property="og:description" content="為封面 A案．B案．C案 與內頁版式A．版式B 評分，免登入，每項 1–3 分。">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="設計提案評分｜A案．B案．C案">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#E8E8E6;
    --bar:#EAEAE8;
    --line:#CFCFCC;
    --panel:#F4F4F2;
    --panel-line:#D6D6D3;
    --ink:#161616;
    --ink-2:#3A3A3A;
    --mute:#7A7A76;
    --soft:#D3D3D0;
    --orange:#E2864F;
    --orange-ink:#B85E2B;
    --white:#FFFFFF;
    --mono:"Courier Prime","Courier New",ui-monospace,monospace,"Noto Sans TC";
    --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .mono{font-family:var(--mono);letter-spacing:.14em}
  [hidden]{display:none !important}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:24px;padding:14px clamp(16px,4vw,64px)}
  .crumb{display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:.12em;white-space:nowrap;overflow:hidden}
  .crumb b{font-weight:500}
  .crumb .slash{font-size:18px;color:var(--ink)}
  .crumb .mono{font-size:14px}
  nav.tabs{display:flex;gap:6px}
  nav.tabs button{background:none;border:0;padding:9px 16px;cursor:pointer;font-family:var(--mono);letter-spacing:.14em;
    font-size:14px;color:var(--mute);white-space:nowrap}
  nav.tabs button span{font-family:var(--sans);letter-spacing:.12em;margin-left:8px}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{background:var(--orange);color:var(--ink)}
  .counter{font-size:14px;color:var(--mute);white-space:nowrap}
  @media (max-width:760px){
    .topbar{grid-template-columns:1fr auto;gap:10px 12px;padding:12px 16px}
    nav.tabs{grid-column:1 / -1;grid-row:2;overflow-x:auto;margin:0 -4px}
    nav.tabs button{padding:8px 12px;font-size:13px}
    .crumb{font-size:13px;gap:8px}
    .crumb .mono{font-size:12px}
  }

  main{padding:0 clamp(16px,4vw,64px) 80px;max-width:1500px;margin:0 auto}

  /* ---------- hero ---------- */
  .hero{padding:clamp(28px,5vw,64px) 0 clamp(20px,3vw,40px)}
  .eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--mono);letter-spacing:.14em;color:var(--mute);font-size:15px}
  .eyebrow::before{content:"";width:11px;height:11px;background:var(--ink);display:inline-block}
  h1{font-weight:900;font-size:clamp(34px,6vw,76px);line-height:1.08;margin:14px 0 14px;letter-spacing:.02em}
  .lead{margin:0;color:var(--ink-2);font-size:clamp(15px,1.6vw,18px);line-height:1.7;max-width:46em}

  /* ---------- notices ---------- */
  .notice{border-left:6px solid var(--orange);background:var(--panel);padding:14px 18px;margin:0 0 24px;line-height:1.7;font-size:15px}
  .notice b{font-weight:700}

  /* ---------- respondent info ---------- */
  .info{background:var(--panel);border:1px solid var(--panel-line);padding:clamp(18px,3vw,36px) clamp(18px,3vw,44px);margin-bottom:clamp(16px,2.5vw,40px)}
  .info-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
  .info-head h2{margin:0;font-weight:900;font-size:clamp(22px,2.4vw,30px);letter-spacing:.06em}
  .info-head .mono{font-size:13px;color:var(--mute)}
  .info-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(16px,3vw,48px)}
  @media (max-width:760px){.info-fields{grid-template-columns:1fr}}
  .field{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--panel-line)}
  .field b{font-weight:900;font-size:clamp(18px,1.8vw,22px);letter-spacing:.08em}
  .field input{width:100%;border:1px solid var(--panel-line);background:var(--white);padding:12px 14px;font-size:16px}
  .field input:focus{outline:2px solid var(--orange);outline-offset:-2px}
  .info .field:first-child{border-top:0;padding-top:0;padding-bottom:0}
  .field.missing input{border-color:var(--orange);box-shadow:inset 4px 0 0 var(--orange)}

  /* ---------- lock ---------- */
  .lock{max-width:560px;margin:0 auto}
  .lock form{display:flex;gap:10px;margin-top:6px}
  .lock input{flex:1;min-width:0;border:1px solid #3A3A3A;background:#222;color:var(--white);padding:14px 16px;font-size:20px;letter-spacing:.4em;font-family:var(--mono)}
  .lock input:focus{outline:2px solid var(--orange);outline-offset:-2px}
  .lock .err{color:#FF9C6B;font-size:14px;min-height:1.6em;margin-top:10px}

  /* ---------- proposal cards ---------- */
  .proposals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.5vw,40px)}
  @media (max-width:900px){.proposals{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--panel-line);padding:clamp(18px,3vw,44px);scroll-margin-top:120px}
  .card-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
  .card-head h2{margin:0;font-weight:900;font-size:clamp(28px,3.4vw,44px);letter-spacing:.04em;display:flex;align-items:center;gap:14px}
  .card-head h2 .chip{display:inline-block;width:18px;height:18px;background:var(--orange)}
  .card[data-p="B"] .card-head h2 .chip{background:var(--ink)}
  .card-head .mono{color:var(--mute);font-size:14px}

  .img-slot{position:relative;background:var(--ink);border:1px solid var(--ink);aspect-ratio:4 / 3;display:flex;
    align-items:center;justify-content:center;overflow:hidden}
  .img-slot img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;background:var(--ink)}
  .placeholder{position:absolute;inset:0;padding:8%;display:grid;grid-template-rows:auto 1fr auto;gap:6%}
  .placeholder .ph-bar{height:14px;width:34%;background:#5A5A57}
  .placeholder .ph-block{background:#2A2A2A}
  .placeholder .ph-lines{display:grid;gap:10px}
  .placeholder .ph-lines i{display:block;height:9px;background:#2A2A2A}
  .placeholder .ph-lines i:last-child{width:60%}
  .placeholder .ph-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .placeholder .ph-label span{background:var(--white);color:var(--ink);padding:10px 16px;font-size:14px;font-family:var(--mono);letter-spacing:.12em}
  .slot-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--white);padding:10px 18px;cursor:pointer;font-size:14px;letter-spacing:.1em}
  .btn:hover{background:var(--ink-2)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--white)}
  .btn.orange{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .btn.orange:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:6px 12px;font-size:13px}
  .slot-msg{font-size:13px;color:var(--mute);align-self:center}

  .criteria{margin-top:28px;border-top:1px solid var(--panel-line)}
  .crit{display:grid;grid-template-columns:132px minmax(0,1fr);gap:6px 20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--panel-line)}
  .crit-name{font-weight:900;font-size:clamp(20px,2vw,26px);letter-spacing:.06em}
  .crit-name small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
  @media (max-width:480px){.crit{grid-template-columns:96px minmax(0,1fr);gap:6px 14px}}
  .crit-ctl{display:grid;gap:6px}
  .crit-read{display:flex;align-items:baseline;gap:10px;min-height:30px}
  .crit-read .num{font-weight:900;font-size:26px;color:var(--orange);min-width:.8em;line-height:1}
  .crit-read .txt{font-size:15px;font-weight:700;letter-spacing:.08em}
  .crit.untouched .crit-read .num{color:var(--soft)}
  .crit.untouched .crit-read .txt{color:var(--mute);font-weight:400}
  .crit.missing{box-shadow:inset 4px 0 0 var(--orange);padding-left:12px}
  .crit.missing .crit-read .txt{color:var(--orange-ink);font-weight:700}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;cursor:pointer;--fill:50%}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(to right,var(--orange) 0 var(--fill),var(--soft) var(--fill) 100%)}
  input[type=range]::-moz-range-track{height:6px;background:linear-gradient(to right,var(--orange) 0 var(--fill),var(--soft) var(--fill) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--ink)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:0;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--ink)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--orange)}
  input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--orange)}
  .crit.untouched input[type=range]::-webkit-slider-runnable-track{background:var(--soft)}
  .crit.untouched input[type=range]::-moz-range-track{background:var(--soft)}
  .crit.untouched input[type=range]::-webkit-slider-thumb{background:#9A9A96;box-shadow:0 0 0 1px #9A9A96}
  .crit.untouched input[type=range]::-moz-range-thumb{background:#9A9A96;box-shadow:0 0 0 1px #9A9A96}
  .ticks{display:flex;justify-content:space-between;padding:0 7px;font-size:12px;color:var(--mute)}
  .ticks span{width:10px;text-align:center}

  .sugg{display:block;margin-top:24px}
  .sugg-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .sugg-label b{font-weight:900;font-size:clamp(20px,2vw,26px);letter-spacing:.06em}
  .sugg-label .mono{font-size:12px;color:var(--mute)}
  textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--panel-line);background:var(--white);padding:14px 16px;font-size:16px;line-height:1.7}
  textarea:focus{outline:2px solid var(--orange);outline-offset:-2px}

  /* ---------- dark submit panel ---------- */
  .dark{background:var(--ink);color:var(--white);padding:clamp(22px,3.5vw,56px);margin-top:clamp(16px,2.5vw,40px)}
  .dark h3{margin:0;font-weight:900;font-size:clamp(26px,3.4vw,44px);letter-spacing:.04em}
  .dark .rule{height:1px;background:#3A3A3A;margin:22px 0 26px}
  .dark .mono{color:#A9A9A5}
  .submit-row{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between}
  .swatches{display:flex;gap:10px;align-items:center}
  .swatches i{width:44px;height:44px;display:block;border:1px solid #3A3A3A}
  .status{font-size:15px;line-height:1.7;min-height:1.7em}
  .status.ok{color:var(--orange)}
  .status.err{color:#FF9C6B}
  .dark .btn.orange{font-size:17px;padding:16px 34px;font-weight:700}
  .done-mark{display:inline-block;width:12px;height:12px;background:var(--orange);margin-right:10px;vertical-align:middle}

  /* ---------- admin ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);margin-bottom:clamp(16px,2.5vw,40px)}
  @media (max-width:700px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--panel);border:1px solid var(--panel-line);padding:22px 24px}
  .stat .mono{font-size:13px;color:var(--mute)}
  .stat .big{font-weight:900;font-size:clamp(36px,4vw,56px);line-height:1.1;margin-top:8px}
  .stat .big small{font-size:.4em;font-weight:500;color:var(--mute);margin-left:6px}
  .live{display:inline-flex;align-items:center;gap:8px}
  .live::before{content:"";width:8px;height:8px;background:var(--orange);display:inline-block}

  .compare{display:grid;gap:26px}
  .cmp-row{display:grid;grid-template-columns:120px 1fr;gap:10px 24px;align-items:center}
  @media (max-width:600px){.cmp-row{grid-template-columns:1fr}}
  .cmp-name{font-weight:900;font-size:22px;letter-spacing:.06em}
  .bars{display:grid;gap:8px}
  .bar{display:grid;grid-template-columns:48px 1fr 54px;align-items:center;gap:12px;font-size:14px}
  .bar .who{font-weight:700}
  .bar .track{height:22px;background:#2A2A2A;position:relative}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:var(--orange);transition:width .4s ease}
  .bar.b .fill{background:#E6E6E4}
  .bar .val{font-family:var(--mono);letter-spacing:.06em;text-align:right;font-size:16px}
  .scale{display:grid;grid-template-columns:120px 48px 1fr 54px;gap:0 12px;font-size:11px;color:#8A8A86}
  .scale > div{display:flex;justify-content:space-between}
  @media (max-width:600px){.scale{grid-template-columns:48px 1fr 54px}.scale .sp1{display:none}}
  .dist{font-family:var(--mono);font-size:12px;color:#8A8A86;letter-spacing:.06em;padding-left:60px;margin-top:-2px}

  .section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:clamp(28px,4vw,56px) 0 16px}
  .section-title h3{margin:0;font-weight:900;font-size:clamp(24px,2.8vw,36px);letter-spacing:.04em}
  .section-title .mono{font-size:13px;color:var(--mute)}
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
  @media (max-width:900px){.two{grid-template-columns:1fr}}
  .notes{background:var(--panel);border:1px solid var(--panel-line);padding:22px 24px}
  .notes h4{margin:0 0 6px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
  .notes h4 i{width:12px;height:12px;background:var(--orange);display:inline-block}
  .notes.b h4 i{background:var(--ink)}
  .note{border-top:1px solid var(--panel-line);padding:14px 0;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .note .meta{display:block;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.08em;margin-bottom:4px;white-space:normal}
  .empty{color:var(--mute);font-size:14px;padding:14px 0;border-top:1px solid var(--panel-line)}

  .table-wrap{background:var(--panel);border:1px solid var(--panel-line);overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
  th,td{padding:12px 14px;border-bottom:1px solid var(--panel-line);text-align:center;white-space:nowrap}
  th{font-weight:700;background:#EDEDEB;font-size:13px}
  th.grp-a{border-bottom:3px solid var(--orange)}
  th.grp-b{border-bottom:3px solid var(--ink)}
  td.name,th.name{text-align:left}
  td.time{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
  td .del{background:none;border:1px solid var(--panel-line);padding:4px 10px;cursor:pointer;font-size:12px}
  td .del.confirm{background:var(--orange);border-color:var(--orange)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(22,22,22,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;background:var(--ink)}
  .lightbox .x{position:absolute;top:16px;right:16px;background:var(--orange);border:0;width:44px;height:44px;font-size:22px;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;font-size:14px;z-index:60;letter-spacing:.06em}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
  /* ---------- v2 ---------- */
  .refresh-note{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.08em}
  .section-title{flex-wrap:wrap}
  .section-title h3{white-space:nowrap}
  nav.tabs{position:relative}
  nav.tabs button .caret{display:inline-block;margin-left:8px;font-size:11px;transform:translateY(-1px)}
  .menu{position:fixed;z-index:40;background:var(--ink);min-width:200px;padding:6px 0;box-shadow:0 10px 28px rgba(0,0,0,.2)}
  .menu button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;text-align:left;background:none;border:0;color:var(--white);padding:14px 20px;font-size:16px;letter-spacing:.1em;cursor:pointer}
  .menu button .mono{color:#A9A9A5;font-size:12px}
  .menu button:hover,.menu button:focus-visible{background:var(--orange);color:var(--ink);outline:none}
  .menu button:hover .mono,.menu button:focus-visible .mono{color:var(--ink)}

  .sec{scroll-margin-top:110px;margin-bottom:clamp(28px,4vw,56px)}
  .sec-head{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:clamp(16px,2.5vw,32px)}
  .sec-head .sec-num{font-family:var(--mono);font-size:clamp(18px,1.8vw,24px);color:var(--orange-ink);letter-spacing:.1em}
  .sec-head h2{margin:0;font-weight:900;font-size:clamp(28px,3.2vw,44px);letter-spacing:.06em}
  .sec-head .en{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute);letter-spacing:.14em}
  .proposals{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
  .card{padding:clamp(18px,2.4vw,36px)}
  .card-head h2{font-size:clamp(26px,2.8vw,38px)}
  .crit{grid-template-columns:108px minmax(0,1fr);gap:6px 16px}
  .crit-name{font-size:clamp(19px,1.6vw,23px)}
  @media (max-width:480px){.crit{grid-template-columns:92px minmax(0,1fr)}}
  .ticks span{width:auto;min-width:10px}

  .admin-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(12px,2vw,24px)}
  .admin-imgs .card{padding:clamp(14px,2vw,24px)}
  .admin-imgs .card-head{margin-bottom:12px}
  .admin-imgs .card-head h2{font-size:24px}
  .admin-imgs .sec-tag{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.1em}
  .bar.c .fill{background:#8A8A86}
  .bar{grid-template-columns:64px 1fr 54px}
  .scale{grid-template-columns:120px 64px 1fr 54px}
  @media (max-width:600px){.scale{grid-template-columns:64px 1fr 54px}}
  .dist{padding-left:76px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:13px}
  .legend i{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px}
  .stat .big.sm{font-size:clamp(28px,3vw,40px)}
  .stat .sub{font-size:14px;color:var(--mute);margin-top:4px}
  .dark + .dark{margin-top:clamp(16px,2.5vw,32px)}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ink);color:var(--white);padding:clamp(20px,3vw,40px) clamp(22px,3.5vw,56px)}
  .pager .pg-note{font-size:15px;color:#DCDCD8;line-height:1.7}
  .pager .pg-note b{color:var(--orange);font-weight:700}
  .pager .btn.orange{font-size:17px;padding:16px 30px;font-weight:700}
  .prev-row{margin-bottom:clamp(16px,2.5vw,28px)}
  .pg-note.err{color:#FF9C6B}
  .pg-note.ok{color:var(--orange)}
  .pager .btn.orange{min-width:180px}
  .pager .btn.orange.sent{background:#F4CDB1;border-color:#F4CDB1;color:#7A4321;cursor:default;filter:none}
  .step-tag{display:inline-block;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--mute);margin-top:10px}
  #admin-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(16px,2.5vw,32px);align-items:start}
  .img-sub{flex-wrap:wrap;align-items:center}
  .img-sub .pick-box{margin-left:auto}
  .pick.light{background:var(--white);color:var(--ink);border-color:var(--panel-line);font-size:16px;padding:10px 42px 10px 14px;min-width:170px}
  .img-group .card .slot-tools{margin-top:14px}
  .img-group .card{padding:clamp(14px,2vw,24px)}
  .img-group .card-head{margin-bottom:12px}
  .img-group .card-head h2{font-size:24px}
  .img-group .sec-tag{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.1em}
  .img-sub{display:flex;align-items:baseline;gap:14px;margin:0 0 16px}
  .img-sub .sec-num{font-family:var(--mono);font-size:16px;color:var(--orange-ink);letter-spacing:.1em}
  .img-sub h4{margin:0;font-weight:900;font-size:clamp(20px,2vw,26px);letter-spacing:.06em}
  .img-sub .en{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.14em}
  .res-panel{background:var(--panel);border:1px solid var(--panel-line);color:var(--ink);padding:clamp(22px,3.5vw,56px)}
  .res-panel + .res-panel{margin-top:clamp(16px,2.5vw,32px)}
  .res-panel h3{margin:0;font-weight:900;font-size:clamp(26px,3.4vw,44px);letter-spacing:.04em}
  .res-panel .mono{color:var(--mute)}
  .res-panel .rule{height:1px;background:var(--panel-line);margin:22px 0 26px}
  .res-panel .pick-wrap label{color:var(--mute)}
  .res-panel .res-total .lbl,.res-panel .res-total .of,.res-panel .res-total .n{color:var(--mute)}
  .res-panel .res-total b{color:var(--orange)}
  .res-panel .rc-track{background:#DCDCD8}
  .res-panel .rc-dist{color:#555552}
  .res-panel .rc-dist i{background:#8A8A86}
  .res-panel .rc-scale{color:var(--mute)}
  .res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .pick-wrap{position:relative;display:inline-flex;align-items:center;gap:12px}
  .pick-wrap label{font-family:var(--mono);font-size:13px;color:#A9A9A5;letter-spacing:.12em}
  .pick-box{position:relative}
  .pick-box::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--orange);pointer-events:none;font-size:14px}
  .pick{appearance:none;-webkit-appearance:none;background:#222;color:var(--white);border:1px solid #5A5A57;border-radius:0;padding:12px 44px 12px 16px;font-size:17px;font-weight:700;letter-spacing:.08em;cursor:pointer;min-width:150px}
  .pick:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(20px,3vw,48px);align-items:start}
  @media (max-width:1000px){.res-grid{grid-template-columns:1fr}}
  .res-img{background:#000;aspect-ratio:4 / 3;border:1px solid #3A3A3A;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .res-img img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
  .res-img span{color:#8A8A86;font-family:var(--mono);font-size:13px;letter-spacing:.1em}
  .res-total{margin-top:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap;white-space:nowrap}
  .res-total .lbl{font-size:14px;color:#A9A9A5;letter-spacing:.08em}
  .res-total b{font-size:clamp(34px,3.4vw,48px);font-weight:900;color:var(--orange);line-height:1}
  .res-total .of{color:#A9A9A5;font-size:16px}
  .res-total .n{margin-left:auto;font-size:14px;color:#A9A9A5;letter-spacing:.04em}
  .res-crit{display:grid;gap:26px}
  .rc-row{display:grid;grid-template-columns:116px minmax(0,1fr) 60px;gap:10px 18px;align-items:center}
  .rc-name{font-weight:900;font-size:22px;letter-spacing:.06em}
  .rc-track{height:24px;background:#2A2A2A;position:relative}
  .rc-fill{position:absolute;inset:0 auto 0 0;background:var(--orange);transition:width .4s ease}
  .rc-val{font-family:var(--mono);font-size:20px;text-align:right}
  .rc-dist{grid-column:2 / 4;display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:#BDBDB9;letter-spacing:.04em}
  .rc-dist span{display:inline-flex;align-items:center;gap:8px}
  .rc-dist b{font-weight:700;color:var(--ink)}
  .rc-dist i{display:inline-block;height:8px;background:#6B6B68}
  .rc-scale{display:grid;grid-template-columns:116px minmax(0,1fr) 60px;gap:0 18px;font-family:var(--mono);font-size:11px;color:#8A8A86}
  .rc-scale div{display:flex;justify-content:space-between}
  @media (max-width:600px){.rc-row,.rc-scale{grid-template-columns:76px minmax(0,1fr) 48px;gap:8px 12px}.rc-name{font-size:18px}.rc-dist{grid-column:1 / -1}}
  .tbl-group + .tbl-group{margin-top:clamp(24px,3vw,40px)}
  .tbl-group .img-sub{margin-bottom:12px}
  .tbl-group .img-sub .count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute);letter-spacing:.08em}
  .th-pick-box{display:inline-block;position:relative}
  .th-pick-box::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--orange);pointer-events:none;font-size:13px}
  .pick.th-pick{background:transparent;color:var(--ink);border:1px solid transparent;font-size:15px;font-weight:700;padding:6px 30px 6px 12px;min-width:0;letter-spacing:.06em;text-align:center}
  .pick.th-pick:hover{background:var(--white);border-color:var(--panel-line)}
  .tbl-group table{min-width:560px}
  .del-note{margin:14px 0 0;font-size:13px;color:var(--mute)}
  th.grp{border-bottom:3px solid var(--ink)}
  th.grp.o{border-bottom-color:var(--orange)}
  th.grp.g{border-bottom-color:#8A8A86}
</style>
</head>
<body>

<header class="topbar">
  <div class="crumb"><b>雄心大誌</b><span class="slash">/</span><span class="mono">設計提案評分</span></div>
  <nav class="tabs" id="tabs" aria-label="頁面導覽"></nav>
  <div class="counter mono" id="counter">0 / 9</div>
</header>

<main>
  <!-- ===================== FORM VIEW ===================== -->
  <section id="view-form">
    <div class="hero">
      <div class="eyebrow">Design Review</div>
      <h1 id="hero-title">請為提案評分</h1>
      <p class="lead" id="hero-lead">封面提案與內頁版式，每個項目滑動 1–3 分，滑動時會顯示對應的程度；完成後按「送出評分」即可。</p>
      <span class="step-tag" id="step-tag">Page 1 / 2</span>
    </div>

    <div id="form-notice"></div>

    <section class="info" aria-label="職稱">
      <div class="info-fields" style="grid-template-columns:minmax(0,1fr)">
        <label class="field" id="field-title"><b>職稱</b><input id="in-title" type="text" maxlength="60" autocomplete="organization-title" placeholder="請輸入職稱"></label>
      </div>
    </section>

    <div id="sections"></div>

    <div class="pager" id="pager-cover">
      <div class="pg-note" id="note-cover" role="status" aria-live="polite">完成按送出即可</div>
      <button class="btn orange" id="send-cover" type="button">送出</button>
    </div>

    <div class="pager" id="pager-layout">
      <div class="pg-note" id="note-layout" role="status" aria-live="polite">完成按送出即可</div>
      <button class="btn orange" id="send-layout" type="button">送出</button>
    </div>
  </section>

  <!-- ===================== ADMIN VIEW ===================== -->
  <section id="view-results" hidden>
    <div class="hero">
      <div class="eyebrow">Results</div>
      <h1>評分結果後台</h1>
      <p class="lead" id="results-lead">請輸入密碼進入後台。</p>
    </div>

    <section class="dark lock" id="lock" style="margin-top:0">
      <div class="mono" style="font-size:13px;margin-bottom:10px">Password</div>
      <h3>請輸入後台密碼</h3>
      <div class="rule"></div>
      <form id="lock-form" autocomplete="off">
        <input id="lock-input" type="password" inputmode="numeric" maxlength="40" aria-label="後台密碼" placeholder="••••">
        <button class="btn orange" type="submit" id="lock-btn">進入</button>
      </form>
      <div class="err" id="lock-err" role="alert"></div>
    </section>

    <div id="results-body" hidden>
      <div id="admin-imgs"></div>
      <div style="height:clamp(28px,4vw,56px)"></div>

      <div class="stats">
        <div class="stat"><div class="mono live">Responses</div><div class="big" id="st-count">0<small>份</small></div></div>
        <div class="stat"><div class="mono">封面提案 最高平均</div><div class="big sm" id="st-cover">–</div><div class="sub" id="st-cover-sub"></div></div>
        <div class="stat"><div class="mono">內頁版式 最高平均</div><div class="big sm" id="st-layout">–</div><div class="sub" id="st-layout-sub"></div></div>
      </div>

      <div id="compare-wrap"></div>

      <div class="section-title">
        <h3>所有回覆</h3>
        <div class="tools">
          <span class="refresh-note" id="refresh-note">每 15 秒自動更新</span>
          <button class="btn ghost sm" id="refresh" type="button">立即更新</button>
          <button class="btn ghost sm" id="copy-csv" type="button">複製 CSV</button>
          <button class="btn sm" id="dl-csv" type="button">下載 CSV（Excel 可開）</button>
        </div>
      </div>
      <div id="tables"></div>
      <p class="del-note">「刪除」會同時移除這個人的封面提案與內頁版式評分。</p>

      <div style="margin-top:40px"><button class="btn ghost sm" id="logout" type="button">登出後台</button></div>
    </div>
  </section>
</main>

<input type="file" id="file-input" accept="image/*" hidden>

<script>
(() => {
  "use strict";

  // ---------- structure ----------
  const SECTIONS = [
    {
      key: "cover", num: "01", label: "封面提案", en: "Cover Proposal",
      items: [
        { key: "A", label: "A案", en: "Proposal A", slot: "A" },
        { key: "B", label: "B案", en: "Proposal B", slot: "B" },
        { key: "C", label: "C案", en: "Proposal C", slot: "C" },
      ],
      criteria: [
        { key: "identity",       label: "識別度", en: "Identity" },
        { key: "representative", label: "代表性", en: "Representation" },
        { key: "readability",    label: "易讀性", en: "Readability" },
      ],
    },
    {
      key: "layout", num: "02", label: "內頁版式", en: "Page Layout",
      items: [
        { key: "A", label: "版式A", en: "Layout A", slot: "LA" },
        { key: "B", label: "版式B", en: "Layout B", slot: "LB" },
      ],
      criteria: [
        { key: "whitespace", label: "人文感",   en: "Human Touch" },
        { key: "rhythm",     label: "閱讀節奏", en: "Reading Rhythm" },
        { key: "hierarchy",  label: "圖文層級", en: "Hierarchy" },
      ],
    },
  ];
  const LEVELS = { 1: "普通好", 2: "剛剛好", 3: "超級好" };
  const MAX = 3;
  const TOTAL = SECTIONS.reduce((n, s) => n + s.items.length * s.criteria.length, 0);
  const ITEM_COLORS = ["var(--orange)", "#E6E6E4", "#8A8A86"];
  const MINE_KEY = "review-my-rating-v2";
  const PW_KEY = "review-admin-pw";
  const REFRESH_MS = 15000;

  const SUPA_URL = String(window.SUPABASE_URL || "").trim().replace(/\/+$/, "");
  const SUPA_KEY = String(window.SUPABASE_KEY || "").trim();
  const CONFIGURED = /^https:\/\//.test(SUPA_URL) && SUPA_KEY.length > 20 && !/貼上/.test(SUPA_KEY);

  const state = { images: {}, responses: [], view: "form", submitting: false, pw: null, timer: null, pendingSlot: null, menu: null };
  const $ = (s, el = document) => el.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const store = {
    get(area, k) { try { return window[area].getItem(k); } catch { return null; } },
    set(area, k, v) { try { window[area].setItem(k, v); } catch {} },
    del(area, k) { try { window[area].removeItem(k); } catch {} },
  };
  const allItems = () => SECTIONS.flatMap(s => s.items.map(it => ({ sec: s, it })));

  function toast(msg) {
    document.querySelectorAll(".toast").forEach(n => n.remove());
    const t = el("div", "toast", msg);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ---------- Supabase RPC ----------
  async function rpc(fn, args) {
    if (!CONFIGURED) throw Object.assign(new Error("not configured"), { code: "config" });
    const headers = { "Content-Type": "application/json", apikey: SUPA_KEY };
    if (SUPA_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPA_KEY;
    const res = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(args || {}) });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const err = new Error((data && data.message) || res.statusText || "request failed");
      err.status = res.status; err.code = data && data.code;
      throw err;
    }
    return data;
  }
  const isWrongPw = (e) => e && (e.code === "28P01" || /wrong password/i.test(e.message || ""));
  const isMissingFn = (e) => e && (e.code === "PGRST202" || e.status === 404);

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  function token() { const b = new Uint8Array(24); crypto.getRandomValues(b); return Array.from(b, x => x.toString(16).padStart(2, "0")).join(""); }

  // ---------- build the form ----------
  function buildForm() {
    const host = $("#sections");
    for (const sec of SECTIONS) {
      const section = el("section", "sec");
      section.id = "sec-" + sec.key;
      const head = el("div", "sec-head");
      head.append(el("span", "sec-num", sec.num), el("h2", null, sec.label), el("span", "en", sec.en));
      section.appendChild(head);

      const grid = el("div", "proposals");
      sec.items.forEach((it, idx) => {
        const card = el("article", "card");
        card.id = `card-${sec.key}-${it.key}`;
        card.style.scrollMarginTop = "110px";

        const ch = el("div", "card-head");
        const h = el("h2");
        const chip = el("span", "chip");
        chip.style.background = ITEM_COLORS[idx] === "#E6E6E4" ? "var(--ink)" : ITEM_COLORS[idx];
        h.append(chip, document.createTextNode(it.label));
        ch.append(h, el("span", "mono", it.en));
        card.appendChild(ch);

        const slot = el("div", "img-slot");
        slot.id = "slot-" + it.slot;
        card.appendChild(slot);

        const crits = el("div", "criteria");
        for (const c of sec.criteria) {
          const row = el("div", "crit untouched");
          row.dataset.s = sec.key; row.dataset.i = it.key; row.dataset.c = c.key;
          const name = el("div", "crit-name", c.label);
          name.appendChild(el("small", null, c.en));
          const ctl = el("div", "crit-ctl");
          const read = el("div", "crit-read");
          read.append(el("span", "num", "–"), el("span", "txt", "請滑動評分"));
          const range = document.createElement("input");
          range.type = "range"; range.min = "1"; range.max = String(MAX); range.step = "1"; range.value = "2";
          range.setAttribute("aria-label", `${sec.label} ${it.label} ${c.label}，1 到 ${MAX} 分`);
          range.style.setProperty("--fill", "50%");
          const ticks = el("div", "ticks mono");
          for (let i = 1; i <= MAX; i++) ticks.appendChild(el("span", null, String(i)));
          ctl.append(read, range, ticks);
          row.append(name, ctl);
          crits.appendChild(row);
          const onMove = () => {
            const before = range.dataset.last;
            setRow(row, Number(range.value), true); updateProgress();
            if (before !== range.value) { range.dataset.last = range.value; markDirty(sec.key); }
          };
          ["input", "change", "pointerup", "keyup"].forEach(ev => range.addEventListener(ev, onMove));
        }
        card.appendChild(crits);
        grid.appendChild(card);
      });
      section.appendChild(grid);
      host.appendChild(section);
    }
    renderSlots();
  }

  function setRow(row, v, touched) {
    const range = $("input", row);
    range.value = String(v);
    range.style.setProperty("--fill", ((v - 1) / (MAX - 1) * 100) + "%");
    if (touched) {
      row.classList.remove("untouched", "missing");
      row.dataset.touched = "1";
      $(".num", row).textContent = String(v);
      $(".txt", row).textContent = LEVELS[v];
      range.setAttribute("aria-valuetext", `${v} 分，${LEVELS[v]}`);
    }
  }
  const rows = () => Array.from(document.querySelectorAll(".crit"));
  const rowOf = (s, i, c) => document.querySelector(`.crit[data-s="${s}"][data-i="${i}"][data-c="${c}"]`);

  function updateProgress() {
    const key = state.view === "layout" ? "layout" : "cover";
    const mine = rows().filter(r => r.dataset.s === key);
    const done = mine.filter(r => r.dataset.touched === "1").length;
    $("#counter").textContent = `${done} / ${mine.length}`;
  }

  // ---------- images ----------
  function placeholder(text) {
    const ph = el("div", "placeholder");
    ph.append(el("div", "ph-bar"), el("div", "ph-block"));
    const lines = el("div", "ph-lines");
    lines.append(el("i"), el("i"), el("i"));
    ph.appendChild(lines);
    const lab = el("div", "ph-label");
    lab.appendChild(el("span", null, text));
    ph.appendChild(lab);
    return ph;
  }

  function fillSlot(slot, label, src) {
    slot.replaceChildren();
    if (src) {
      const img = document.createElement("img");
      img.src = src; img.alt = `${label} 設計圖`;
      img.addEventListener("click", () => openLightbox(img.src, img.alt));
      slot.appendChild(img);
    } else {
      slot.appendChild(placeholder(`${label} 圖片準備中`));
    }
  }

  function renderSlots() {
    for (const { it } of allItems()) {
      const slot = $("#slot-" + it.slot);
      if (slot) fillSlot(slot, it.label, state.images[it.slot]);
    }
    renderAdminImages();
  }

  async function loadImages() {
    if (!CONFIGURED) return;
    try {
      const list = await rpc("get_images");
      const next = {};
      (list || []).forEach(r => { if (r && typeof r.slot === "string") next[r.slot] = r.data_url; });
      state.images = next;
      renderSlots();
    } catch (e) { console.warn("images", e); }
  }

  function renderAdminImages() {
    const box = $("#admin-imgs");
    if (!box) return;
    if (!state.imgPick) state.imgPick = {};
    box.replaceChildren();
    for (const sec of SECTIONS) {
      const pickKey = sec.items.some(i => i.key === state.imgPick[sec.key]) ? state.imgPick[sec.key] : sec.items[0].key;
      const it = sec.items.find(i => i.key === pickKey);
      const group = el("div", "img-group");

      const sub = el("div", "img-sub");
      const selId = "imgpick-" + sec.key;
      const h4 = el("h4");
      const lab = el("label", null, sec.label); lab.htmlFor = selId; lab.style.cursor = "pointer";
      h4.appendChild(lab);
      const pbox = el("div", "pick-box");
      const sel = document.createElement("select");
      sel.className = "pick light"; sel.id = selId;
      for (const opt of sec.items) {
        const o = document.createElement("option");
        o.value = opt.key;
        o.textContent = `${opt.label}（${state.images[opt.slot] ? "已上傳" : "未上傳"}）`;
        if (opt.key === pickKey) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => {
        state.imgPick[sec.key] = sel.value;
        renderAdminImages();
        const again = document.getElementById(selId); if (again) again.focus({ preventScroll: true });
      });
      pbox.appendChild(sel);
      sub.append(el("span", "sec-num", sec.num), h4, pbox);

      const card = el("div", "card");
      const head = el("div", "card-head");
      const h2 = el("h2"); h2.appendChild(document.createTextNode(it.label));
      head.append(h2, el("span", "sec-tag", it.en));
      const slot = el("div", "img-slot");
      fillSlot(slot, it.label, state.images[it.slot]);
      const tools = el("div", "slot-tools");
      const up = el("button", "btn sm", state.images[it.slot] ? "更換圖片" : "上傳圖片");
      up.type = "button";
      up.addEventListener("click", () => pickFile(it.slot));
      tools.appendChild(up);
      if (state.images[it.slot]) {
        const rm = el("button", "btn ghost sm", "移除");
        rm.type = "button";
        rm.addEventListener("click", async () => {

  function imageError(err, slotKey) {
    console.error(err);
    if (isWrongPw(err)) return handleAdminError(err);
    const m = $("#slotmsg-" + slotKey);
    const needsSql = err && (err.code === "23514" || /check constraint/i.test(err.message || ""));
    if (m) m.textContent = needsSql ? "資料庫尚未更新，請先執行 update_v2.sql" : "失敗：" + (err.message || "請再試一次");
  }

  function pickFile(slotKey) {
    state.pendingSlot = slotKey;
    const fi = $("#file-input");
    fi.value = "";
    fi.click();
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const LIM = 2000;
        const scale = Math.min(1, LIM / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.88, out = c.toDataURL("image/jpeg", q);
        while (out.length > 4500000 && q > 0.4) { q -= 0.12; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("無法讀取這張圖片")); };
      img.src = url;
    });
  }

  $("#file-input").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    const key = state.pendingSlot;
    if (!file || !key || !state.pw) return;
    const msg = $("#slotmsg-" + key);
    if (msg) msg.textContent = "處理並上傳中…";
    try {
      const dataUrl = await compressImage(file);
      await rpc("admin_set_image", { pw: state.pw, p_slot: key, p_data: dataUrl });
      state.images[key] = dataUrl;
      renderSlots();
      toast("圖片已更新");
    } catch (err) { imageError(err, key); }
  });

  // ---------- lightbox ----------
  function openLightbox(src, alt) {

    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "關閉");
    lb.append(img, x);
    const close = () => { lb.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (ev) => { if (ev.key === "Escape") close(); };
    lb.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

  // ---------- submit (each page sends on its own) ----------
  const NOTE_DEFAULT = "完成按送出即可";
  state.sent = { cover: false, layout: false };

  function setNote(key, text, kind) {
    const n = $("#note-" + key);
    n.className = "pg-note" + (kind ? " " + kind : "");
    n.textContent = text;
  }
  function setSent(key, on) {
    state.sent[key] = on;
    const btn = $("#send-" + key);
    btn.classList.toggle("sent", on);
    btn.textContent = on ? "已送出" : "送出";
    btn.setAttribute("aria-disabled", on ? "true" : "false");
    if (on) setNote(key, key === "cover" ? "已送出。" : "已送出，謝謝你的評分！", "ok");
    else setNote(key, NOTE_DEFAULT);
  }
  function markDirty(key) { if (state.sent[key]) setSent(key, false); }

  function loadMine() { try { return JSON.parse(store.get("localStorage", MINE_KEY) || "null"); } catch { return null; } }

  async function submitSection(key) {
    if (state.submitting || state.sent[key]) return;
    const sec = SECTIONS.find(x => x.key === key);
    if (!CONFIGURED) { setNote(key, "網站尚未連接資料庫，請通知主辦人。", "err"); return; }
    const title = $("#in-title").value.trim();
    if (!title) {
      $("#field-title").classList.add("missing");
      setNote(key, "請先填寫「職稱」。", "err");
      $(".info").scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => $("#in-title").focus({ preventScroll: true }), 300);
      return;
    }
    const missing = rows().filter(r => r.dataset.s === key && r.dataset.touched !== "1");
    if (missing.length) {
      missing.forEach(r => { r.classList.add("missing"); $(".txt", r).textContent = "請滑動評分"; });
      setNote(key, `還有 ${missing.length} 個項目尚未評分（已標示橘色）。`, "err");
      missing[0].scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    const part = {};
    for (const it of sec.items) {
      part[it.key] = {};
      for (const c of sec.criteria) part[it.key][c.key] = Number($("input", rowOf(key, it.key, c.key)).value);
    }
    const mine = loadMine() || { id: uuid(), token: token(), values: { scores: {} } };
    const payload = { id: mine.id, token: mine.token, title, scores: { [key]: part } };

    state.submitting = true;
    const btn = $("#send-" + key);
    btn.disabled = true; btn.textContent = "送出中…";
    try {
      await rpc("submit_rating", { p: payload });
      const values = mine.values || { scores: {} };
      values.title = title;
      values.scores = Object.assign({}, values.scores, { [key]: part });
      store.set("localStorage", MINE_KEY, JSON.stringify({ id: mine.id, token: mine.token, values }));
      btn.disabled = false;
      setSent(key, true);
      toast(`${sec.label}已送出`);
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = "送出";
      setNote(key, isMissingFn(err) || (err && err.code === "22023") ? "網站資料庫尚未更新，請通知主辦人。" : "送出失敗，請檢查網路後再試一次。", "err");
    } finally {
      state.submitting = false;
    }
  }
  $("#send-cover").addEventListener("click", () => submitSection("cover"));
  $("#send-layout").addEventListener("click", () => submitSection("layout"));

  function prefillMine() {
    const mine = loadMine();
    if (!mine || !mine.values) return;
    const v = mine.values;
    if (v.title) $("#in-title").value = v.title;
    for (const sec of SECTIONS) {
      let any = false;
      for (const it of sec.items) for (const c of sec.criteria) {
        const n = Number(v.scores && v.scores[sec.key] && v.scores[sec.key][it.key] && v.scores[sec.key][it.key][c.key]);
        if (n >= 1 && n <= MAX) {
          const row = rowOf(sec.key, it.key, c.key);
          setRow(row, n, true);
          $("input", row).dataset.last = String(n);
          any = true;
        }
      }
      if (any) setSent(sec.key, true);
    }
    updateProgress();
  }

  $("#in-title").addEventListener("input", () => {

  // ---------- nav with dropdowns ----------
  function closeMenu() {

  }

      m.appendChild(b);
    }
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    const left = Math.max(8, Math.min(r.left, window.innerWidth - m.offsetWidth - 8));
    m.style.left = left + "px";
    m.style.top = (r.bottom + 6) + "px";

  document.addEventListener("click", (e) => {

  function pageOf(id) { return /^card-layout-|^sec-layout/.test(id) ? "layout" : "cover"; }
  function setPage(page) {
    const hash = page === "cover" ? "#cover" : "#" + page;

  }
  function goTo(id) {

  }

  function buildNav() {

  function routeFromHash() {

  // ---------- admin ----------
  function renderGate() {
    const u = !!state.pw;
    $("#lock").hidden = u;
    $("#results-body").hidden = !u;
    $("#results-lead").textContent = u ? "上傳提案圖片、查看所有回覆與平均分數。" : "請輸入密碼進入後台。";
    if (!u) { setTimeout(() => { const i = $("#lock-input"); if (i && !$("#lock").hidden) i.focus(); }, 50); return; }
    renderAdminImages();
    renderResults();
    loadResponses();
    startRefresh();
  }

  function startRefresh() {
    stopRefresh();
    state.timer = setInterval(() => { if (state.view === "results" && state.pw && !document.hidden) loadResponses(true); }, REFRESH_MS);
  }
  function stopRefresh() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  function handleAdminError(e, fallback) {
    if (isWrongPw(e)) {
      state.pw = null; store.del("sessionStorage", PW_KEY);
      $("#lock-err").textContent = "密碼已變更或失效，請重新輸入。";
      renderGate();
    } else if (isMissingFn(e)) {
      toast("資料庫尚未更新，請先執行 update_v2.sql");
    } else {
      toast(fallback || "連線失敗，請稍後再試");
    }
  }

  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("#lock-input");
    const pw = input.value;
    if (!pw) return;
    if (!CONFIGURED) { $("#lock-err").textContent = "網站尚未連接資料庫，請先在 config.js 填入 Supabase 設定。"; return; }
    $("#lock-btn").disabled = true;
    try {
      await rpc("admin_login", { pw });
      state.pw = pw;
      store.set("sessionStorage", PW_KEY, pw);
      input.value = ""; $("#lock-err").textContent = "";
      renderGate();
    } catch (err) {
      $("#lock-err").textContent = isWrongPw(err) ? "密碼錯誤，請再試一次。" : "無法連線到資料庫，請稍後再試。";
      input.value = ""; input.focus();
    } finally {
      $("#lock-btn").disabled = false;
    }
  });

  $("#logout").addEventListener("click", () => {
    state.pw = null; store.del("sessionStorage", PW_KEY); stopRefresh(); renderGate();
  });
  $("#refresh").addEventListener("click", () => loadResponses());

  let loading = false;
  async function loadResponses(silent) {
    if (!state.pw || loading) return;
    loading = true;
    try {
      const list = await rpc("admin_list_ratings", { pw: state.pw });
      state.responses = (list || []).map(r => ({ id: r.id, title: r.title, updatedAt: r.updated_at, scores: r.scores || {} }));
      const t = new Date(), pad = (x) => String(x).padStart(2, "0");
      $("#refresh-note").textContent = `每 15 秒自動更新・最後更新 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
      renderResults();
    } catch (e) {
      console.warn(e);
      if (isWrongPw(e) || !silent) handleAdminError(e, "讀取回覆失敗，請稍後再試");
    } finally { loading = false; }
  }

  // ---------- results ----------
  const fmt = (n) => (n == null || isNaN(n)) ? "–" : n.toFixed(2);
  const score = (r, s, i, c) => { const v = r.scores && r.scores[s] && r.scores[s][i] && r.scores[s][i][c]; return typeof v === "number" ? v : null; };
  function avg(list) { const v = list.filter(x => typeof x === "number" && x >= 1 && x <= MAX); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
  function timeStr(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const p = (x) => String(x).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  const itemAvg = (list, sec, it) => avg(list.flatMap(r => sec.criteria.map(c => score(r, sec.key, it.key, c.key))));

  function renderResults() {
    const list = state.responses;
    $("#st-count").replaceChildren(document.createTextNode(String(list.length)), el("small", null, "份"));
    for (const sec of SECTIONS) {
      const ranked = sec.items.map(it => ({ it, a: itemAvg(list, sec, it) })).filter(x => x.a != null).sort((a, b) => b.a - a.a);
      const big = $("#st-" + sec.key), sub = $("#st-" + sec.key + "-sub");
      if (!ranked.length) { big.textContent = "–"; sub.textContent = "尚無資料"; continue; }
      const top = ranked.filter(x => Math.abs(x.a - ranked[0].a) < 1e-9);
      big.replaceChildren(document.createTextNode(top.map(x => x.it.label).join("、") + " "), el("small", null, fmt(ranked[0].a) + " / 3"));
      sub.textContent = ranked.map(x => `${x.it.label} ${fmt(x.a)}`).join("　");
    }

    const wrap = $("#compare-wrap");
    wrap.replaceChildren();
    for (const sec of SECTIONS) {
      if (!state.pick) state.pick = {};
      const pickKey = state.pick[sec.key] && sec.items.some(i => i.key === state.pick[sec.key]) ? state.pick[sec.key] : sec.items[0].key;
      const it = sec.items.find(i => i.key === pickKey);

      const panel = el("section", "res-panel");
      if (sec === SECTIONS[0]) panel.style.marginTop = "0";
      const head = el("div", "res-head");
      const t = el("div");
      const mono = el("div", "mono", `${sec.num} ${sec.en}`); mono.style.fontSize = "13px"; mono.style.marginBottom = "10px";
      t.append(mono, el("h3", null, sec.label));
      const pw = el("div", "pick-wrap");
      const selId = "pick-" + sec.key;
      const lab = el("label", null, "查看"); lab.htmlFor = selId;
      const box = el("div", "pick-box");
      const sel = document.createElement("select");
      sel.className = "pick light"; sel.id = selId;
      for (const opt of sec.items) {
        const o = document.createElement("option");
        o.value = opt.key; o.textContent = opt.label;
        if (opt.key === pickKey) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => { state.pick[sec.key] = sel.value; renderResults(); const again = document.getElementById(selId); if (again) again.focus({ preventScroll: true }); });
      box.appendChild(sel);
      pw.append(lab, box);
      head.append(t, pw);
      panel.append(head, el("div", "rule"));

      const grid = el("div", "res-grid");
      // left: image + total
      const left = el("div");
      const fig = el("div", "res-img");
      const src = state.images[it.slot];
      if (src) {
        const img = document.createElement("img");
        img.src = src; img.alt = `${it.label} 設計圖`;
        img.addEventListener("click", () => openLightbox(img.src, img.alt));
        fig.appendChild(img);
      } else fig.appendChild(el("span", null, `${it.label} 尚未上傳圖片`));
      const answered = list.filter(r => r.scores && r.scores[sec.key] && r.scores[sec.key][it.key]).length;
      const tot = el("div", "res-total");
      tot.append(el("span", "lbl", `${it.label} 總平均`), el("b", null, fmt(itemAvg(list, sec, it))), el("span", "of", "/ 3"), el("span", "n", `${answered} 份評分`));
      left.append(fig, tot);

      // right: criteria
      const right = el("div", "res-crit");
      for (const c of sec.criteria) {
        const vals = list.map(r => score(r, sec.key, it.key, c.key)).filter(v => v != null);
        const a = avg(vals);
        const row = el("div", "rc-row");
        const track = el("div", "rc-track");
        const fill = el("div", "rc-fill");
        fill.style.width = a == null ? "0%" : (a / MAX * 100) + "%";
        track.appendChild(fill);
        row.append(el("div", "rc-name", c.label), track, el("div", "rc-val", fmt(a)));
        const dist = el("div", "rc-dist");
        for (let lv = 1; lv <= MAX; lv++) {
          const cnt = vals.filter(v => v === lv).length;
          const sp = el("span");
          sp.append(document.createTextNode(`${lv} ${LEVELS[lv]}`), el("b", null, `${cnt} 票`));
          dist.appendChild(sp);
        }
        row.appendChild(dist);
        right.appendChild(row);
      }
      const scale = el("div", "rc-scale");
      const sd = el("div");
      for (let i = 0; i <= MAX; i++) sd.appendChild(el("span", null, String(i)));
      scale.append(el("span"), sd, el("span"));
      right.appendChild(scale);

      grid.append(left, right);
      panel.appendChild(grid);
      wrap.appendChild(panel);
    }

    // tables: one per section
    const tables = $("#tables");
    tables.replaceChildren();
    for (const sec of SECTIONS) {
      const rowsFor = list.filter(r => r.scores && r.scores[sec.key]);
      if (!state.tblPick) state.tblPick = {};
      const pickKey = sec.items.some(i => i.key === state.tblPick[sec.key]) ? state.tblPick[sec.key] : sec.items[0].key;
      const it = sec.items.find(i => i.key === pickKey);
      const idx = sec.items.indexOf(it);

      const group = el("div", "tbl-group");
      const sub = el("div", "img-sub");
      const selId = "tblpick-" + sec.key;
      const h4 = el("h4", null, sec.label);
      const pbox = el("div", "th-pick-box");
      const sel = document.createElement("select");
      sel.className = "pick th-pick"; sel.id = selId;
      sel.setAttribute("aria-label", `${sec.label}：選擇要查看的案`);
      for (const opt of sec.items) {
        const o = document.createElement("option");
        o.value = opt.key; o.textContent = opt.label;
        if (opt.key === pickKey) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => {
        state.tblPick[sec.key] = sel.value;

        const again = document.getElementById(selId); if (again) again.focus({ preventScroll: true });

      pbox.appendChild(sel);
      sub.append(el("span", "sec-num", sec.num), h4, el("span", "count", `${rowsFor.length} 份`));

      const wrapT = el("div", "table-wrap");
      const table = el("table");
      const thead = el("thead"), tbody = el("tbody");
      const r1 = el("tr"), r2 = el("tr");
      const thT = el("th", "name", "職稱"); thT.rowSpan = 2; r1.appendChild(thT);
      const thG = el("th", "grp" + (idx === 0 ? " o" : idx === 2 ? " g" : "")); thG.colSpan = sec.criteria.length; thG.appendChild(pbox); r1.appendChild(thG);
      for (const c of sec.criteria) r2.appendChild(el("th", null, c.label));
      const thTime = el("th", null, "送出時間"); thTime.rowSpan = 2;
      const thDel = el("th", null, "管理"); thDel.rowSpan = 2;
      r1.append(thTime, thDel);
      thead.append(r1, r2);

      if (!rowsFor.length) {
        const tr = el("tr"); const td = el("td", null, `目前還沒有人送出${sec.label}評分。`);
        td.colSpan = 3 + sec.criteria.length; td.style.color = "var(--mute)"; tr.appendChild(td); tbody.appendChild(tr);
      }
      for (const r of rowsFor) {
        const tr = el("tr");
        tr.appendChild(el("td", "name", r.title || "–"));
        for (const c of sec.criteria) {
          const v = score(r, sec.key, it.key, c.key);
          tr.appendChild(el("td", null, v ? `${v} ${LEVELS[v]}` : "–"));
        }
        tr.appendChild(el("td", "time", timeStr(r.updatedAt)));
        const tdDel = el("td");
        const b = el("button", "del", "刪除");
        b.type = "button";
        b.addEventListener("click", async () => {
          if (!b.classList.contains("confirm")) {
            b.classList.add("confirm"); b.textContent = "確定刪除？";
            setTimeout(() => { if (b.isConnected) { b.classList.remove("confirm"); b.textContent = "刪除"; } }, 4000);
            return;
          }
          b.disabled = true;
          try { await rpc("admin_delete_rating", { pw: state.pw, p_id: r.id }); toast("已刪除"); loadResponses(); }
          catch (e) { b.disabled = false; handleAdminError(e, "刪除失敗"); }
        });
        tdDel.appendChild(b);
        tr.appendChild(tdDel);
        tbody.appendChild(tr);
      }
      table.append(thead, tbody);
      wrapT.appendChild(table);
      group.append(sub, wrapT);
      tables.appendChild(group);
    }
  }

  function buildCSV() {
    const esc = (v) => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = ["職稱", "送出時間"];
    for (const sec of SECTIONS) for (const it of sec.items) for (const c of sec.criteria) head.push(`${it.label}-${c.label}`);
    const lines = [head.map(esc).join(",")];
    for (const r of state.responses) {
      const row = [r.title, r.updatedAt ? new Date(r.updatedAt).toLocaleString("zh-TW") : ""];
      for (const sec of SECTIONS) for (const it of sec.items) for (const c of sec.criteria) row.push(score(r, sec.key, it.key, c.key));
      lines.push(row.map(esc).join(","));
    }
    return lines.join("\r\n");
  }
  $("#copy-csv").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(buildCSV()); toast("已複製，可直接貼到試算表"); }
    catch { toast("無法複製"); }
  });
  $("#dl-csv").addEventListener("click", () => {
    const blob = new Blob(["﻿" + buildCSV()], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `設計提案評分_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  // ---------- init ----------
  buildForm();
  buildNav();
  updateProgress();
  prefillMine();
  state.pw = store.get("sessionStorage", PW_KEY);
  routeFromHash();
  if (!CONFIGURED) {
    const n = el("div", "notice");
    n.appendChild(el("b", null, "網站尚未連接資料庫。"));
    n.appendChild(document.createTextNode("請在 config.js 填入 Supabase 的 Project URL 與 Key。"));
    $("#form-notice").appendChild(n);
  }
  loadImages();
})();
</script>
</body>
